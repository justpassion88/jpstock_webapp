<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Chi tiết cổ phiếu | JP Stock Analysis V2</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Plotly.js for charts -->
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    
    <style>
        body { background-color: #111827; }
    </style>
</head>
<body class="bg-gray-900 min-h-screen text-gray-100">
    <!-- Header with Navigation -->
    <header class="bg-gradient-to-r from-blue-800 to-purple-800 text-white shadow-lg">
        <div class="container mx-auto px-4 py-4">
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
                <div class="flex items-center gap-4">
                    <a href="javascript:history.back()" class="flex items-center text-white hover:text-blue-200 transition-colors">
                        <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                        </svg>
                        <span class="font-semibold">Quay lại</span>
                    </a>
                    <h1 class="text-xl font-bold">📊 JP Stock Analysis</h1>
                </div>
                <nav class="flex flex-wrap gap-2">
                    <a href="index.html" class="bg-indigo-600 hover:bg-indigo-700 px-3 py-1.5 rounded-lg text-sm font-semibold">
                        🏠 Trang chủ
                    </a>
                    <a href="sector.html?sector=banks" class="bg-emerald-600 hover:bg-emerald-700 px-3 py-1.5 rounded-lg text-sm font-semibold">
                        🏦 Ngân hàng
                    </a>
                    <a href="sector.html?sector=realestate" class="bg-green-600 hover:bg-green-700 px-3 py-1.5 rounded-lg text-sm font-semibold">
                        🏠 BĐS
                    </a>
                </nav>
            </div>
        </div>
    </header>
    
    <!-- Main Content -->
    <main class="container mx-auto px-4 py-6">
        <!-- Stock Header -->
        <div id="stock-header"></div>
        
        <!-- Valuation Section -->
        <div id="valuation-section"></div>
        
        <!-- Historical Returns -->
        <div id="historical-returns"></div>
        
        <!-- P/B Chart -->
        <div id="pb-chart" class="bg-gray-800 rounded-lg p-6 mb-6">
            <h2 class="text-xl font-bold text-white mb-4">📈 Biểu đồ P/B lịch sử</h2>
            <div id="pb-chart-container" style="height: 400px;"></div>
        </div>
        
        <!-- Daily P/B Table -->
        <div id="quarterly-table"></div>
        
        <!-- Back button -->
        <div class="mt-8 text-center">
            <a href="index.html" class="inline-flex items-center px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
                Quay lại danh sách
            </a>
        </div>
    </main>
    
    <!-- Footer -->
    <footer class="bg-gray-800 text-gray-400 py-6 mt-8">
        <div class="container mx-auto px-4 text-center text-sm">
            <p>JP Stock Analysis V2 - Phân tích P/B với Historical Backtest</p>
            <p class="mt-2 text-gray-500">⚠️ Công cụ phân tích tham khảo, không phải khuyến nghị đầu tư.</p>
        </div>
    </footer>
    
    <script src="js/notes-config.js"></script>
    <script src="js/icopy-config.js"></script>
    <script src="js/stock.js"></script>
</body>
</html>
