name: Update Bank Data Daily

on:
  schedule:
    # Chạy lúc 6:00 AM UTC (1:00 PM Vietnam) mỗi ngày
    - cron: '0 6 * * *'
  workflow_dispatch:  # Cho phép chạy manual

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Tăng timeout vì rate limit
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: src/requirements.txt
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt
      
      - name: Fetch bank data from vnstock
        run: |
          cd src
          python fetch_data.py
        env:
          PYTHONUNBUFFERED: "1"
        timeout-minutes: 20  # Timeout cho fetch (rate limit ~4s/request)
      
      - name: Run P/B analysis
        run: |
          cd src
          python analyze.py
        env:
          PYTHONUNBUFFERED: "1"
      
      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/data/
          git diff --staged --quiet || git commit -m "📊 Auto-update bank data $(date +'%Y-%m-%d %H:%M')"
          git push
